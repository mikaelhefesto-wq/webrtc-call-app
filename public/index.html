<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC Call & Screen Share - Tempo Real</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    video {
      transform: scaleX(-1);
    }
    video.no-mirror {
      transform: scaleX(1);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.4);
      border-radius: 9999px;
    }
    .pulse-ring {
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulse-ring 2s infinite cubic-bezier(0.66, 0, 0, 1);
    }
    @keyframes pulse-ring {
      to { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans select-none overflow-hidden">

  <!-- ================= TELA 1: LOBBY ================= -->
  <div id="lobbyScreen" class="flex-1 flex flex-col items-center justify-center p-4 relative z-10">
    <div class="absolute inset-0 bg-gradient-to-tr from-indigo-950/40 via-slate-950 to-emerald-950/30 -z-10 pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
          <i data-lucide="video" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            Nexus Call <span class="text-xs bg-indigo-500/20 text-indigo-300 font-semibold px-2 py-0.5 rounded-full border border-indigo-500/30">WebRTC P2P</span>
          </h1>
          <p class="text-xs text-slate-400">Vídeo, áudio e transmissão de tela sem limites</p>
        </div>
      </div>

      <!-- Preview da Câmera no Lobby -->
      <div class="relative w-full aspect-video bg-slate-950 rounded-2xl overflow-hidden mb-6 border border-slate-800 shadow-inner group">
        <video id="lobbyPreviewVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <div id="lobbyPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950 text-slate-500">
          <i data-lucide="camera-off" class="w-10 h-10 mb-2 stroke-1"></i>
          <span class="text-xs font-medium">Câmera desativada</span>
        </div>

        <div class="absolute bottom-3 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-slate-900/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-slate-700/60 shadow-lg">
          <button id="lobbyMicToggle" type="button" class="p-2 rounded-full hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="mic" class="w-4 h-4"></i>
          </button>
          <button id="lobbyCamToggle" type="button" class="p-2 rounded-full hover:bg-slate-800 text-slate-300 hover:text-white transition">
            <i data-lucide="video" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Formulário de Entrada -->
      <form id="joinForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5" for="roomInput">
            Nome da Sala
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="hash" class="w-4 h-4"></i>
            </div>
            <input 
              id="roomInput" 
              type="text" 
              required 
              placeholder="ex: reuniao-de-equipe" 
              class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5" for="nameInput">
            Seu Nome ou Apelido
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input 
              id="nameInput" 
              type="text" 
              required 
              placeholder="ex: Carlos Silva" 
              class="w-full pl-10 pr-4 py-2.5 bg-slate-950/60 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
            />
          </div>
        </div>

        <button 
          id="joinBtn" 
          type="submit" 
          class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition active:scale-[0.99]"
        >
          <span>Entrar na Chamada</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- ================= TELA 2: SALA DE CHAMADA ================= -->
  <div id="callScreen" class="hidden flex-1 flex flex-col h-full bg-slate-950 overflow-hidden relative">
    
    <header class="h-16 px-4 md:px-6 bg-slate-900/80 border-b border-slate-800/80 flex items-center justify-between backdrop-blur-md z-20">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 pulse-ring"></div>
        <div>
          <div class="flex items-center gap-2">
            <h2 id="activeRoomName" class="font-bold text-sm md:text-base text-white tracking-wide">sala</h2>
            <button id="copyRoomBtn" title="Copiar link da sala" class="text-slate-400 hover:text-white p-1 rounded-md hover:bg-slate-800 transition">
              <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <p id="participantCount" class="text-[11px] text-slate-400">1 participante conectado</p>
        </div>
      </div>

      <button id="toggleChatBtn" class="relative p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center gap-2 text-xs font-medium">
        <i data-lucide="message-square" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Chat</span>
        <span id="unreadBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 rounded-full bg-indigo-500 text-[10px] text-white flex items-center justify-center font-bold">1</span>
      </button>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
      <main class="flex-1 p-3 md:p-6 overflow-y-auto custom-scrollbar flex items-center justify-center">
        <div id="videoGrid" class="w-full h-full max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-4 items-center justify-center auto-rows-fr">
          
          <!-- Box do Vídeo Local -->
          <div id="localVideoContainer" class="relative w-full h-full min-h-[220px] max-h-[75vh] bg-slate-900 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl flex items-center justify-center">
            <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <div id="localPlaceholder" class="hidden absolute inset-0 bg-slate-900 flex flex-col items-center justify-center">
              <div id="localAvatar" class="w-20 h-20 rounded-full bg-indigo-600/30 border border-indigo-500/50 flex items-center justify-center text-indigo-300 text-2xl font-bold mb-2 shadow-lg">EU</div>
              <span class="text-xs text-slate-400 font-medium">Sua câmera está desligada</span>
            </div>

            <div class="absolute bottom-3 left-3 flex items-center gap-2 bg-slate-950/75 backdrop-blur-md px-3 py-1 rounded-full border border-slate-700/40 text-xs font-medium text-white shadow-md">
              <span id="localNameLabel">Você</span>
              <span id="localMicIndicator">
                <i data-lucide="mic" class="w-3.5 h-3.5 text-emerald-400"></i>
              </span>
            </div>

            <div id="screenShareBadge" class="hidden absolute top-3 left-3 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 px-2.5 py-1 rounded-full text-[11px] font-semibold flex items-center gap-1.5 backdrop-blur-md">
              <i data-lucide="screen-share" class="w-3.5 h-3.5"></i>
              <span>Compartilhando tela</span>
            </div>
          </div>

        </div>
      </main>

      <!-- Painel de Chat -->
      <aside id="chatDrawer" class="hidden w-80 md:w-96 bg-slate-900 border-l border-slate-800 flex flex-col z-30 transition-all">
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <h3 class="font-bold text-sm text-white flex items-center gap-2">
            <i data-lucide="messages-square" class="w-4 h-4 text-indigo-400"></i>
            Chat da Sala
          </h3>
          <button id="closeChatBtn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar text-xs">
          <div class="bg-indigo-950/40 border border-indigo-800/40 text-indigo-300 p-2.5 rounded-xl text-center">
            Mensagens em tempo real para os membros da sala.
          </div>
        </div>

        <form id="chatForm" class="p-3 border-t border-slate-800 flex gap-2">
          <input id="chatInput" type="text" placeholder="Digite sua mensagem..." class="flex-1 px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:ring-1 focus:ring-indigo-500" />
          <button type="submit" class="p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition">
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </form>
      </aside>
    </div>

    <!-- Barra Inferior de Controles -->
    <footer class="h-20 bg-slate-900/90 border-t border-slate-800/80 flex items-center justify-center px-4 backdrop-blur-lg z-20">
      <div class="flex items-center gap-2 sm:gap-3 bg-slate-950/80 p-2 rounded-2xl border border-slate-800 shadow-2xl">
        <button id="micBtn" title="Ligar/Desligar Microfone" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition active:scale-95">
          <i data-lucide="mic" class="w-5 h-5"></i>
        </button>

        <button id="camBtn" title="Ligar/Desligar Câmera" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition active:scale-95">
          <i data-lucide="video" class="w-5 h-5"></i>
        </button>

        <button id="screenBtn" title="Compartilhar Tela" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center transition active:scale-95">
          <i data-lucide="screen-share" class="w-5 h-5"></i>
        </button>

        <div class="w-px h-6 bg-slate-800 mx-1"></div>

        <button id="leaveBtn" title="Sair da Chamada" class="px-4 h-12 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-medium flex items-center gap-2 transition active:scale-95 shadow-lg shadow-rose-600/30">
          <i data-lucide="phone-off" class="w-5 h-5"></i>
          <span class="text-xs font-semibold hidden sm:inline">Desconectar</span>
        </button>
      </div>
    </footer>
  </div>

  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-slate-700 text-white px-4 py-2 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300">
    <i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMsg">Notificação</span>
  </div>

  <!-- ================= SCRIPT WEBRTC ================= -->
  <script>
    lucide.createIcons();

    const RTC_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    };

    const state = {
      ws: null,
      peerId: null,
      roomName: '',
      userName: '',
      localStream: null,
      screenStream: null,
      isAudioMuted: false,
      isVideoMuted: false,
      isScreenSharing: false,
      peerConnections: new Map(),
      iceCandidatesQueue: new Map()
    };

    const lobbyScreen = document.getElementById('lobbyScreen');
    const callScreen = document.getElementById('callScreen');
    const joinForm = document.getElementById('joinForm');
    const roomInput = document.getElementById('roomInput');
    const nameInput = document.getElementById('nameInput');
    const lobbyPreviewVideo = document.getElementById('lobbyPreviewVideo');
    const lobbyPlaceholder = document.getElementById('lobbyPlaceholder');

    const videoGrid = document.getElementById('videoGrid');
    const localVideo = document.getElementById('localVideo');
    const localPlaceholder = document.getElementById('localPlaceholder');
    const localAvatar = document.getElementById('localAvatar');
    const localNameLabel = document.getElementById('localNameLabel');
    const localMicIndicator = document.getElementById('localMicIndicator');
    const screenShareBadge = document.getElementById('screenShareBadge');
    const activeRoomName = document.getElementById('activeRoomName');
    const participantCount = document.getElementById('participantCount');

    const micBtn = document.getElementById('micBtn');
    const camBtn = document.getElementById('camBtn');
    const screenBtn = document.getElementById('screenBtn');
    const leaveBtn = document.getElementById('leaveBtn');

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
    }

    function getInitials(name) {
      if (!name) return '??';
      const parts = name.trim().split(' ');
      return parts.length === 1 ? parts[0].substring(0, 2).toUpperCase() : (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    async function initLobby() {
      try {
        state.localStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        lobbyPreviewVideo.srcObject = state.localStream;
        lobbyPlaceholder.classList.add('hidden');
      } catch (err) {
        lobbyPlaceholder.classList.remove('hidden');
      }
    }
    initLobby();

    joinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      state.roomName = roomInput.value.trim().toLowerCase();
      state.userName = nameInput.value.trim();

      localNameLabel.textContent = `${state.userName} (Você)`;
      localAvatar.textContent = getInitials(state.userName);
      activeRoomName.textContent = `#${state.roomName}`;

      if (!state.localStream) {
        try {
          state.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        } catch (err) {
          state.localStream = new MediaStream();
        }
      }

      localVideo.srcObject = state.localStream;

      connectSignaling();

      lobbyScreen.classList.add('hidden');
      callScreen.classList.remove('hidden');
      updateGrid();
    });

    function connectSignaling() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      state.ws = new WebSocket(`${protocol}//${window.location.host}`);

      state.ws.onopen = () => {
        sendWs({
          type: 'join',
          room: state.roomName,
          userName: state.userName,
          status: { isAudioMuted: state.isAudioMuted, isVideoMuted: state.isVideoMuted }
        });
      };

      state.ws.onmessage = async (evt) => {
        const msg = JSON.parse(evt.data);
        handleSignalMessage(msg);
      };
    }

    function sendWs(data) {
      if (state.ws && state.ws.readyState === WebSocket.OPEN) {
        state.ws.send(JSON.stringify(data));
      }
    }

    async function handleSignalMessage(msg) {
      switch (msg.type) {
        case 'room-joined':
          state.peerId = msg.peerId;
          updateParticipantCount(msg.peers.length + 1);
          for (const peer of msg.peers) {
            createPeerCard(peer.peerId, peer.userName, peer.status);
            await initiateCall(peer.peerId);
          }
          break;

        case 'peer-joined':
          showToast(`${msg.userName} entrou`);
          createPeerCard(msg.peerId, msg.userName, msg.status);
          updateParticipantCount(state.peerConnections.size + 2);
          break;

        case 'signal':
          await handlePeerSignal(msg.fromPeerId, msg.payload);
          break;

        case 'peer-status':
          updatePeerStatus(msg.peerId, msg.status);
          break;

        case 'chat':
          appendChatMessage(msg.userName, msg.message, msg.timestamp, msg.peerId === state.peerId);
          break;

        case 'peer-left':
          showToast(`${msg.userName || 'Um participante'} saiu`);
          removePeer(msg.peerId);
          break;
      }
    }

    function getOrCreatePeerConnection(peerId) {
      if (state.peerConnections.has(peerId)) return state.peerConnections.get(peerId);

      const pc = new RTCPeerConnection(RTC_CONFIG);

      if (state.localStream) {
        state.localStream.getTracks().forEach(track => pc.addTrack(track, state.localStream));
      }

      pc.onicecandidate = (e) => {
        if (e.candidate) {
          sendWs({
            type: 'signal',
            targetPeerId: peerId,
            payload: { type: 'candidate', candidate: e.candidate }
          });
        }
      };

      pc.ontrack = (e) => {
        const remoteVideo = document.getElementById(`video-${peerId}`);
        if (remoteVideo) remoteVideo.srcObject = e.streams[0];
      };

      state.peerConnections.set(peerId, pc);
      return pc;
    }

    async function initiateCall(peerId) {
      const pc = getOrCreatePeerConnection(peerId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      sendWs({
        type: 'signal',
        targetPeerId: peerId,
        payload: { type: 'offer', sdp: offer }
      });
    }

    async function handlePeerSignal(fromPeerId, payload) {
      const pc = getOrCreatePeerConnection(fromPeerId);

      if (payload.type === 'offer') {
        await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));

        if (state.iceCandidatesQueue.has(fromPeerId)) {
          const queue = state.iceCandidatesQueue.get(fromPeerId);
          while (queue.length > 0) {
            await pc.addIceCandidate(new RTCIceCandidate(queue.shift()));
          }
        }

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        sendWs({
          type: 'signal',
          targetPeerId: fromPeerId,
          payload: { type: 'answer', sdp: answer }
        });
      } else if (payload.type === 'answer') {
        await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));

        if (state.iceCandidatesQueue.has(fromPeerId)) {
          const queue = state.iceCandidatesQueue.get(fromPeerId);
          while (queue.length > 0) {
            await pc.addIceCandidate(new RTCIceCandidate(queue.shift()));
          }
        }
      } else if (payload.type === 'candidate') {
        if (!pc.remoteDescription || !pc.remoteDescription.type) {
          if (!state.iceCandidatesQueue.has(fromPeerId)) state.iceCandidatesQueue.set(fromPeerId, []);
          state.iceCandidatesQueue.get(fromPeerId).push(payload.candidate);
        } else {
          await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
        }
      }
    }

    function createPeerCard(peerId, peerName, status = {}) {
      if (document.getElementById(`container-${peerId}`)) return;

      const card = document.createElement('div');
      card.id = `container-${peerId}`;
      card.className = "relative w-full h-full min-h-[220px] max-h-[75vh] bg-slate-900 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl flex items-center justify-center";

      card.innerHTML = `
        <video id="video-${peerId}" autoplay playsinline class="no-mirror w-full h-full object-cover"></video>
        <div id="placeholder-${peerId}" class="${status.isVideoMuted ? '' : 'hidden'} absolute inset-0 bg-slate-900 flex flex-col items-center justify-center">
          <div class="w-20 h-20 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-300 text-2xl font-bold mb-2 shadow-lg">
            ${getInitials(peerName)}
          </div>
          <span class="text-xs text-slate-400 font-medium">${peerName}</span>
        </div>
        <div class="absolute bottom-3 left-3 flex items-center gap-2 bg-slate-950/75 backdrop-blur-md px-3 py-1 rounded-full border border-slate-700/40 text-xs font-medium text-white shadow-md">
          <span>${peerName}</span>
          <span id="mic-status-${peerId}">${status.isAudioMuted ? '<i data-lucide="mic-off" class="w-3.5 h-3.5 text-rose-400"></i>' : '<i data-lucide="mic" class="w-3.5 h-3.5 text-emerald-400"></i>'}</span>
        </div>
      `;

      videoGrid.appendChild(card);
      lucide.createIcons();
      updateGrid();
    }

    function updatePeerStatus(peerId, status) {
      const placeholder = document.getElementById(`placeholder-${peerId}`);
      const micStatus = document.getElementById(`mic-status-${peerId}`);
      if (placeholder && status.isVideoMuted !== undefined) placeholder.classList.toggle('hidden', !status.isVideoMuted);
      if (micStatus && status.isAudioMuted !== undefined) {
        micStatus.innerHTML = status.isAudioMuted ? '<i data-lucide="mic-off" class="w-3.5 h-3.5 text-rose-400"></i>' : '<i data-lucide="mic" class="w-3.5 h-3.5 text-emerald-400"></i>';
        lucide.createIcons();
      }
    }

    function removePeer(peerId) {
      if (state.peerConnections.has(peerId)) {
        state.peerConnections.get(peerId).close();
        state.peerConnections.delete(peerId);
      }
      const card = document.getElementById(`container-${peerId}`);
      if (card) card.remove();
      updateParticipantCount(state.peerConnections.size + 1);
      updateGrid();
    }

    function updateParticipantCount(count) {
      participantCount.textContent = `${count} participante${count > 1 ? 's' : ''} conectado${count > 1 ? 's' : ''}`;
    }

    function updateGrid() {
      const total = state.peerConnections.size + 1;
      videoGrid.className = "w-full h-full max-w-7xl mx-auto grid gap-4 items-center justify-center auto-rows-fr";
      if (total === 1) videoGrid.classList.add('grid-cols-1', 'max-w-4xl');
      else if (total === 2) videoGrid.classList.add('grid-cols-1', 'md:grid-cols-2');
      else videoGrid.classList.add('grid-cols-1', 'sm:grid-cols-2', 'lg:grid-cols-3');
    }

    micBtn.addEventListener('click', () => {
      if (!state.localStream) return;
      const track = state.localStream.getAudioTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        state.isAudioMuted = !track.enabled;
        micBtn.classList.toggle('bg-rose-600', state.isAudioMuted);
        micBtn.classList.toggle('bg-slate-800', !state.isAudioMuted);
        micBtn.innerHTML = state.isAudioMuted ? '<i data-lucide="mic-off" class="w-5 h-5"></i>' : '<i data-lucide="mic" class="w-5 h-5"></i>';
        localMicIndicator.innerHTML = state.isAudioMuted ? '<i data-lucide="mic-off" class="w-3.5 h-3.5 text-rose-400"></i>' : '<i data-lucide="mic" class="w-3.5 h-3.5 text-emerald-400"></i>';
        lucide.createIcons();
        sendWs({ type: 'user-status', status: { isAudioMuted: state.isAudioMuted } });
      }
    });

    camBtn.addEventListener('click', () => {
      if (!state.localStream) return;
      const track = state.localStream.getVideoTracks()[0];
      if (track) {
        track.enabled = !track.enabled;
        state.isVideoMuted = !track.enabled;
        camBtn.classList.toggle('bg-rose-600', state.isVideoMuted);
        camBtn.classList.toggle('bg-slate-800', !state.isVideoMuted);
        camBtn.innerHTML = state.isVideoMuted ? '<i data-lucide="video-off" class="w-5 h-5"></i>' : '<i data-lucide="video" class="w-5 h-5"></i>';
        localPlaceholder.classList.toggle('hidden', !state.isVideoMuted);
        lucide.createIcons();
        sendWs({ type: 'user-status', status: { isVideoMuted: state.isVideoMuted } });
      }
    });

    screenBtn.addEventListener('click', async () => {
      if (state.isScreenSharing) {
        stopScreen();
      } else {
        try {
          state.screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
          const screenTrack = state.screenStream.getVideoTracks()[0];

          state.peerConnections.forEach(pc => {
            const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
            if (sender) sender.replaceTrack(screenTrack);
          });

          localVideo.srcObject = state.screenStream;
          localVideo.classList.add('no-mirror');
          screenShareBadge.classList.remove('hidden');
          state.isScreenSharing = true;
          screenBtn.classList.add('bg-emerald-600');
          screenBtn.classList.remove('bg-slate-800');

          screenTrack.onended = () => stopScreen();
        } catch (err) {
          console.warn('Compartilhamento cancelado:', err);
        }
      }
    });

    function stopScreen() {
      if (!state.isScreenSharing) return;
      if (state.screenStream) state.screenStream.getTracks().forEach(t => t.stop());

      const cameraTrack = state.localStream ? state.localStream.getVideoTracks()[0] : null;
      if (cameraTrack) {
        state.peerConnections.forEach(pc => {
          const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) sender.replaceTrack(cameraTrack);
        });
      }

      localVideo.srcObject = state.localStream;
      localVideo.classList.remove('no-mirror');
      screenShareBadge.classList.add('hidden');
      state.isScreenSharing = false;
      screenBtn.classList.remove('bg-emerald-600');
      screenBtn.classList.add('bg-slate-800');
    }

    leaveBtn.addEventListener('click', () => {
      if (state.screenStream) state.screenStream.getTracks().forEach(t => t.stop());
      if (state.localStream) state.localStream.getTracks().forEach(t => t.stop());
      state.peerConnections.forEach(pc => pc.close());
      state.peerConnections.clear();
      sendWs({ type: 'leave' });
      if (state.ws) state.ws.close();
      callScreen.classList.add('hidden');
      lobbyScreen.classList.remove('hidden');
      initLobby();
      showToast('Você desconectou da chamada');
    });

    const chatDrawer = document.getElementById('chatDrawer');
    document.getElementById('toggleChatBtn').addEventListener('click', () => chatDrawer.classList.toggle('hidden'));
    document.getElementById('closeChatBtn').addEventListener('click', () => chatDrawer.classList.add('hidden'));

    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      if (!input.value.trim()) return;
      sendWs({ type: 'chat', message: input.value.trim() });
      input.value = '';
    });

    function appendChatMessage(name, text, time, isMe) {
      const box = document.getElementById('chatMessages');
      const el = document.createElement('div');
      el.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
      el.innerHTML = `
        <span class="text-[11px] text-slate-400 mb-1">${isMe ? 'Você' : name} • ${time}</span>
        <div class="px-3 py-2 rounded-xl text-xs ${isMe ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200'}">${text}</div>
      `;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
